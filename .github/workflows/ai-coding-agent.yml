name: AI coding agent (manual, draft PR only)

on:
  workflow_dispatch:
    inputs:
      task:
        description: "A specific development task for the agent"
        required: true
        type: string
      base_branch:
        description: "Existing development branch to work from"
        required: true
        default: "feat/v3-end-to-end-production"
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ai-coding-agent-${{ github.ref }}
  cancel-in-progress: false

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out selected development base
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.base_branch }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Create isolated task branch
        env:
          AGENT_BRANCH: agent/task-${{ github.run_id }}
        run: |
          git switch -c "$AGENT_BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Ask the model to plan and implement the task
        env:
          TASK: ${{ inputs.task }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
        run: |
          if [ -z "$AI_API_KEY" ] || [ -z "$AI_BASE_URL" ] || [ -z "$AI_MODEL" ]; then
            echo "Missing AI_API_KEY, AI_BASE_URL, or AI_MODEL repository Actions secrets."
            exit 1
          fi
          python .github/agent/run_agent.py
          git diff --check
          if [ ! -s /tmp/agent-changed-files.txt ]; then
            echo "Agent did not produce any approved file changes."
            exit 1
          fi
          while IFS= read -r path; do
            [ -n "$path" ] && git add -- "$path"
          done < /tmp/agent-changed-files.txt
          git commit -m "AI agent: implement requested development task"
          git push --set-upstream origin "$AGENT_BRANCH"

      - name: Run project tests
        id: tests
        if: always()
        env:
          AGENT_BRANCH: agent/task-${{ github.run_id }}
        run: |
          set +e
          if git show-ref --verify --quiet "refs/heads/$AGENT_BRANCH"; then
            python -m pip install -e ".[test]" && python -m pytest -q
            status=$?
          else
            status=125
          fi
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Open a draft pull request for human review
        if: always() && steps.tests.outputs.exit_code != '125'
        env:
          GH_TOKEN: ${{ github.token }}
          AGENT_BRANCH: agent/task-${{ github.run_id }}
          BASE_BRANCH: ${{ inputs.base_branch }}
          TEST_EXIT: ${{ steps.tests.outputs.exit_code }}
        run: |
          if ! git ls-remote --exit-code --heads origin "$AGENT_BRANCH" >/dev/null 2>&1; then
            echo "No pushed agent branch exists; skipping PR creation."
            exit 0
          fi
          {
            cat /tmp/agent-report.md 2>/dev/null || echo "Agent report unavailable."
            echo
            echo "## Automated test result"
            if [ "$TEST_EXIT" = "0" ]; then
              echo "Tests passed."
            else
              echo "Tests failed or could not complete (exit code: $TEST_EXIT). Review the Actions log before considering this change."
            fi
            echo
            echo "## Safety"
            echo "- Draft PR only; no auto-merge."
            echo "- YouTube publishing was not invoked."
            echo "- Review every change before merging."
          } > /tmp/agent-pr-body.md
          gh pr create --draft --repo "$GITHUB_REPOSITORY" \
            --head "$AGENT_BRANCH" --base "$BASE_BRANCH" \
            --title "AI coding agent: task run $GITHUB_RUN_NUMBER" \
            --body-file /tmp/agent-pr-body.md

      - name: Upload agent report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ai-agent-report-${{ github.run_id }}
          path: /tmp/agent-report.md
          if-no-files-found: warn
          retention-days: 7
