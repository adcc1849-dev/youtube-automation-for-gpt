name: Local production pipeline tests

on:
  pull_request:
  push:
    branches: ["feat/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-production:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run complete test suite
        run: python -m pytest -q
      - name: Verify production runner imports
        run: python -c "from btm_pipeline.production import run_production; print('production runner import OK')"
