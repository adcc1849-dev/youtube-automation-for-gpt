[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "beyond-the-machine-pipeline"
version = "0.1.0"
description = "Policy-first, fail-closed foundation for Beyond the Machine video production"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
btm-validate = "btm_pipeline.cli:main"
btm-inspect-media = "btm_pipeline.media_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
