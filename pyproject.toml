[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "beyond-the-machine-pipeline"
version = "0.1.0"
description = "Policy-first, fail-closed foundation for Beyond the Machine video production"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<9"]
publishing = ["google-api-python-client>=2.150,<3", "google-auth>=2.35,<3", "google-auth-httplib2>=0.2,<1"]

[project.scripts]
btm-validate = "btm_pipeline.cli:main"
btm-inspect-media = "btm_pipeline.media_cli:main"
btm-review-bundle = "btm_pipeline.review_cli:main"
btm-draft-script = "btm_pipeline.draft_cli:main"
btm-produce = "btm_pipeline.production_cli:main"
btm-publish = "btm_pipeline.publish_cli:main"
btm-analytics = "btm_pipeline.analytics_cli:main"
btm-verify-upload = "btm_pipeline.verification_cli:main"

[tool.setuptools.package-data]
btm_pipeline = ["skill_assets/LICENSE", "skill_assets/README.md", "skill_assets/skills/*/*.md", "skill_assets/skills/*/*.py", "skill_assets/skills/*/*.json", "skill_assets/templates/*.md"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
